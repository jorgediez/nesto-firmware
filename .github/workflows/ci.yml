name: CI

# Builds and tests in the same container scripts/dev.sh uses locally: the
# simulator for this machine, and the thermostat's ARM program, whose tests and
# screens run under QEMU emulating the thermostat's Cortex-A8. Screenshots and
# the ARM program are kept, so a pull request shows the screens and can be tried
# on a device.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build the dev image
        run: scripts/dev.sh image

      - name: Lint the Python reference implementation and tests
        run: |
          pipx run ruff check tools/ tests/e2e/
          pipx run ruff format --check tools/ tests/e2e/

      - name: Check the protocol test vectors match the Python reference
        run: |
          scripts/dev.sh vectors
          if ! git diff --exit-code -- tests/vectors; then
            echo "::error::tests/vectors is out of date: run scripts/dev.sh vectors and commit the result"
            exit 1
          fi

      - name: Build the simulator, the thermostat's program and the tests
        run: scripts/dev.sh build

      - name: Run the unit tests, natively and on emulated ARM
        run: scripts/dev.sh test

      - name: Run the real panel against the Python client, natively and on emulated ARM
        run: scripts/dev.sh e2e

      - name: Check the ARM programs can run on the thermostat
        run: scripts/dev.sh check-arm

      - name: Take screenshots against the demo room
        run: |
          scripts/dev.sh screens screenshots
          for f in screenshots/*.png; do
            size="$(stat -c %s "$f")"
            if [ "$size" -lt 300000 ]; then
              echo "::error::$f is only $size bytes"
              exit 1
            fi
          done

      - name: Check the ARM build draws the same screen
        run: |
          scripts/dev.sh screens screenshots/arm --only light \
            --panel "qemu-arm -cpu cortex-a8 /build/sim-arm/nesto"
          if ! cmp -s screenshots/light.png screenshots/arm/light.png; then
            echo "::error::The ARM build drew a different screen from the native one; compare light.png and arm/light.png"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/

      - name: Strip the thermostat's program
        run: scripts/dev.sh dist

      - uses: actions/upload-artifact@v7
        with:
          name: nesto-arm
          path: dist/nesto
