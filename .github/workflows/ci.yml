name: CI

# Builds and tests in the same container scripts/dev.sh uses locally: the
# simulator for this machine, and the thermostat's ARM program, whose tests and
# screens run under QEMU emulating the thermostat's Cortex-A8. Screenshots and
# the release package are kept, so a pull request shows the screens and can be
# tried on a device; a version tag's run drafts the release with its package,
# and the program signed with the release key for updates from Home Assistant.
on:
  push:
    branches: [main]
    # A version tag also drafts its release (the release job below).
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the dev image
        run: scripts/dev.sh image

      - name: Lint the Python reference implementation and tests
        run: |
          pipx run ruff check tools/ tests/e2e/
          pipx run ruff format --check tools/ tests/e2e/

      - name: Check the protocol test vectors match the Python reference
        run: |
          scripts/dev.sh vectors
          if ! git diff --exit-code -- tests/vectors; then
            echo "::error::tests/vectors is out of date: run scripts/dev.sh vectors and commit the result"
            exit 1
          fi

      - name: Build the simulator, the thermostat's program and the tests
        run: scripts/dev.sh build

      - name: Run the unit tests, natively and on emulated ARM
        run: scripts/dev.sh test

      - name: Run the real panel against the Python client, natively and on emulated ARM
        run: scripts/dev.sh e2e

      - name: Check the ARM programs can run on the thermostat
        run: scripts/dev.sh check-arm

      - name: Run the device check's report script in busybox and in a POSIX shell
        run: scripts/dev.sh check-report

      - name: Take screenshots against the demo room
        run: |
          scripts/dev.sh screens screenshots
          for f in screenshots/*.png; do
            size="$(stat -c %s "$f")"
            if [ "$size" -lt 300000 ]; then
              echo "::error::$f is only $size bytes"
              exit 1
            fi
          done

      - name: Check the ARM build draws the same screen
        run: |
          scripts/dev.sh screens screenshots/arm --only light \
            --panel "qemu-arm -cpu cortex-a8 /build/sim-arm/nesto"
          if ! cmp -s screenshots/light.png screenshots/arm/light.png; then
            echo "::error::The ARM build drew a different screen from the native one; compare light.png and arm/light.png"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/

      - name: Pack the thermostat's programs as a release
        run: scripts/dev.sh package

      # As a tag's release is signed below, with the test key instead: the
      # .bin and .bin.sig stay here, the release signs its own.
      - name: Check the package's program can be signed for an update
        run: scripts/dev.sh release-sign

      # What a release attaches, from a tag's build: the programs tested above.
      - uses: actions/upload-artifact@v7
        with:
          name: nesto-release
          path: |
            dist/nesto-*.tar.gz
            dist/nesto-*.tar.gz.sha256

  release:
    name: Draft the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # The environment holds NESTO_OTA_KEY, the release key's private half,
    # and lets only version tags read it.
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag names the project's version
        run: |
          version="$(sed -n 's/^project(nesto VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in CMakeLists.txt ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Fetch the package this run built and tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name nesto-release --dir release

      # The package's own nesto, as nesto-VERSION-nest-gen2.bin with its .sig:
      # what Home Assistant sends a panel. The script checks the signature
      # against keys/ota-release.pub, which the panel trusts.
      - name: Sign the program with the release key
        env:
          NESTO_OTA_KEY: ${{ secrets.NESTO_OTA_KEY }}
        run: |
          python3 -m venv /tmp/sign
          /tmp/sign/bin/pip install --quiet cryptography==44.0.0
          PYTHON=/tmp/sign/bin/python scripts/release-sign.sh \
            "release/nesto-$VERSION-nest-gen2.tar.gz" keys/ota-release.pub

      # A draft: the maintainer writes the notes and publishes it. Published
      # releases are immutable, so the files go on before that.
      - name: Draft the release, with the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Nesto $VERSION for the Nest Learning Thermostat (2nd generation)."
            echo
            echo "Install or update: unpack \`nesto-$VERSION-nest-gen2.tar.gz\` and follow its INSTALL.md"
            echo "([online](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/INSTALL.md))."
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 release/nesto-$VERSION-nest-gen2.tar.gz.sha256)\`"
            echo
            echo "\`nesto-$VERSION-nest-gen2.bin\` and its \`.sig\` are the program alone, signed with the"
            echo "release key: Home Assistant's firmware update entity installs them."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
            --title "Nesto $VERSION" --notes-file notes.md
